name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]


permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact CI source
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.authorize.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Verify the completed CI run and current main ref
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["workflow_run"]["id"])' "$GITHUB_EVENT_PATH")"
          WORKFLOW_RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.workflow_id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > workflow-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_RUN" > workflow.json
          gh api "repos/$GITHUB_REPOSITORY" > repository.json
          DEFAULT_BRANCH="$(python -c 'import json; print(json.load(open("repository.json"))["default_branch"])')"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" > default-ref.json
          python -m scripts.authorize_release_event \
            --event "$GITHUB_EVENT_PATH" \
            --run workflow-run.json \
            --workflow workflow.json \
            --default-ref default-ref.json \
            --repository repository.json

  prepare:
    name: Select and build immutable artifacts
    runs-on: ubuntu-latest
    needs: authorize
    permissions:
      contents: read
      pull-requests: read
    outputs:
      source_sha: ${{ needs.authorize.outputs.source_sha }}
      version: ${{ steps.selected.outputs.version }}
      part: ${{ steps.selected.outputs.part }}
      skip: ${{ steps.selected.outputs.skip }}
      pypi_state: ${{ steps.pypi.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.authorize.outputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Gather immutable source and release evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" > associated-pulls.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" > source-commit.json
          python -m scripts.github_release list > releases.json
          git ls-remote --tags origin > tag-refs.txt
          python - <<'PY' > pypi.json
          import json
          from urllib.request import urlopen
          with urlopen("https://pypi.org/pypi/flask-session.manager.sk/json", timeout=30) as response:
              print(json.dumps(json.load(response)))
          PY
          python -c 'import json; print(json.load(open("source-commit.json"))["commit"]["message"], end="")' > commit-message.txt
      - name: Check explicit release suppression marker
        id: marker
        run: |
          if grep -Fq '[skip-version]' commit-message.txt; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Select release version from exact PR association
        id: choose
        if: steps.marker.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python -m scripts.select_release \
            --source-sha "$SOURCE_SHA" \
            --pypi-json pypi.json \
            --branch "$DEFAULT_BRANCH" \
            --pull-requests associated-pulls.json \
            --releases releases.json \
            --tag-refs tag-refs.txt \
            --commit-message-file commit-message.txt
          cat "$GITHUB_OUTPUT"
      - name: Publish selected version as job output
        id: selected
        if: always()
        env:
          SKIP_VERSION: ${{ steps.marker.outputs.skip }}
          CHOSEN_VERSION: ${{ steps.choose.outputs.version }}
          CHOSEN_PART: ${{ steps.choose.outputs.part }}
        run: |
          if [ "$SKIP_VERSION" = "true" ]; then
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "part=skip" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHOSEN_VERSION" ]; then
            echo "version=$CHOSEN_VERSION" >> "$GITHUB_OUTPUT"
            echo "part=$CHOSEN_PART" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release selection was produced." >&2
            exit 1
          fi
      - name: Build with the reserved release version
        if: steps.selected.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ steps.selected.outputs.version }}
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          uv sync --frozen --dev
          export SETUPTOOLS_SCM_PRETEND_VERSION="$VERSION"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_SHA")"
          uv build --no-build-isolation --out-dir ../dist
      - name: Validate package artifacts from the tested source
        if: steps.selected.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ steps.selected.outputs.version }}
        run: |
          python -m scripts.validate_release_artifacts \
            --dist dist --source-sha "$SOURCE_SHA" --version "$VERSION" \
            --manifest dist/release-manifest.json
      - name: Check exact existing PyPI files
        id: pypi
        if: steps.selected.outputs.skip != 'true'
        run: python -m scripts.check_pypi_artifacts --manifest dist/release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.selected.outputs.skip != 'true'
        with:
          name: release-${{ steps.selected.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  reserve-release:
    name: Reserve verified GitHub release
    runs-on: ubuntu-latest
    needs: [authorize, prepare]
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.reservation.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Create or verify the draft release reservation
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m scripts.github_release reserve

  upload-release-assets:
    name: Upload verified GitHub release assets
    runs-on: ubuntu-latest
    needs: [authorize, prepare, reserve-release]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Upload missing assets by reservation ID
        env:
          RELEASE_ID: ${{ needs.reserve-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m scripts.github_release upload

  publish-pypi:
    name: Publish exact artifacts to PyPI
    runs-on: ubuntu-latest
    needs: [authorize, prepare, upload-release-assets]
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Stage only wheel and sdist for PyPI
        run: |
          mkdir -p packages
          mv dist/*.whl dist/*.tar.gz packages/
      - name: Recheck source eligibility and artifact hashes
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT_SHA" = "$SOURCE_SHA"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest=json.loads(Path("dist/release-manifest.json").read_text())
          if manifest.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("artifact source SHA differs from authorized CI")
          if manifest.get("version") != os.environ["VERSION"]:
              raise SystemExit("artifact version differs from selected release")
          for name, expected in manifest["artifacts"].items():
              actual=hashlib.sha256((Path("packages")/name).read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"artifact hash mismatch: {name}")
          PY
      - name: Publish only when PyPI has no files for this version
        if: needs.prepare.outputs.pypi_state == 'publish'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: packages

  finalize-release:
    name: Verify PyPI and publish GitHub release
    runs-on: ubuntu-latest
    needs: [authorize, prepare, reserve-release, upload-release-assets, publish-pypi]
    if: >-
      needs.prepare.outputs.skip != 'true' &&
      needs.upload-release-assets.result == 'success' &&
      (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: dist
      - name: Verify all PyPI files match the candidate build
        env:
          ARTIFACT_STATE: ${{ needs.prepare.outputs.pypi_state }}
          PUBLISH_RESULT: ${{ needs.publish-pypi.result }}
        run: |
          python -m scripts.check_pypi_artifacts \
            --manifest dist/release-manifest.json --output pypi-state.txt
          grep -q 'state=already-published' pypi-state.txt
          python -m scripts.check_finalize_policy \
            --artifact-state "$ARTIFACT_STATE" \
            --publish-result "$PUBLISH_RESULT" \
            --reservation-verified
      - name: Verify draft assets and publish the release
        env:
          RELEASE_ID: ${{ needs.reserve-release.outputs.release_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m scripts.github_release finalize
