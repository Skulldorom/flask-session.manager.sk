name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --dev
      - run: uv run pytest -q
      - run: uv build --no-build-isolation

  release-policy:
    name: Release Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv sync --frozen --dev
      - run: uv run pytest -q tests/test_release_policy.py tests/test_release_artifacts.py tests/test_workflow_security.py tests/test_release_workflow_integration.py tests/test_github_release.py tests/test_recovery_source.py
      - name: Build and validate VCS release metadata without creating a tag
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_SHA")"
          export SETUPTOOLS_SCM_PRETEND_VERSION=1.3.3
          uv build --no-build-isolation --out-dir release-test-dist
          python -m scripts.validate_release_artifacts \
            --dist release-test-dist --source-sha "$SOURCE_SHA" --version 1.3.3 \
            --manifest release-test-dist/release-manifest.json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file runtime-requirements.txt > /dev/null
      - run: uv export --frozen --all-groups --no-emit-project --format requirements-txt --output-file development-requirements.txt > /dev/null
      - run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - run: python -m scripts.run_dependency_audit security/pip-audit-exceptions.json runtime-requirements.txt development-requirements.txt

  companion-compatibility:
    name: Flask ↔ React Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Skulldorom/react-session.manager.sk
          ref: 8569b734306edb49de9d714b3d5a0e4cd0d06fbf
          path: react-companion
      - run: uv sync --frozen --dev
      - run: uv build --no-build-isolation --out-dir dist
      - name: Install the candidate Flask wheel
        run: |
          python -m venv .compat-venv
          .compat-venv/bin/python -m pip install --disable-pip-version-check dist/*.whl
          .compat-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import flask_session_manager_sk
          import sys

          module_path = Path(flask_session_manager_sk.__file__).resolve()
          assert module_path.is_relative_to(Path(sys.prefix).resolve()), module_path
          print(f"Candidate package {version('flask-session.manager.sk')} imported from {module_path}")
          PY
      - name: Build the pinned React companion
        working-directory: react-companion
        run: npm ci && npm run build
      - name: Select browser engines in the pinned harness
        run: python -m scripts.patch_companion_harness react-companion/scripts/companion-compatibility-test.cjs
      - name: Install Chromium and Firefox
        working-directory: react-companion
        run: npx --yes playwright@1.64.1 install --with-deps chromium firefox
      - name: Test Chromium same-origin and cross-site lifecycles
        working-directory: react-companion
        env:
          PYTHON: ${{ github.workspace }}/.compat-venv/bin/python
          COMPANION_BROWSER: chromium
        run: npm run test:companion
      - name: Test Firefox same-origin lifecycle
        working-directory: react-companion
        env:
          PYTHON: ${{ github.workspace }}/.compat-venv/bin/python
          COMPANION_BROWSER: firefox
        run: npm run test:companion
