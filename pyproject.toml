[project]
name = "flask-session.manager.sk"
version = "0.1.3"
description = "Flask companion package for react-session.manager.sk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Skulldorom" }]
dependencies = [
    "flask>=3.1",
    "flask-jwt-extended>=4.7",
    "ua-parser>=1.0",
]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/Skulldorom/flask-session.manager.sk"
Repository = "https://github.com/Skulldorom/flask-session.manager.sk"
Issues = "https://github.com/Skulldorom/flask-session.manager.sk/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
