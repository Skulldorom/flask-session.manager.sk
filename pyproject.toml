[project]
name = "flask-session.manager.sk"
description = "Flask companion package for react-session.manager.sk"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Skulldorom" }]
dependencies = [
    "flask>=3.1",
    "flask-jwt-extended>=4.7",
    "PyJWT>=2.14.0",
    "ua-parser>=1.0",
    "Werkzeug>=3.1.9",
]
classifiers = [
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dynamic = ["urls", "version"]

[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.3.2"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.metadata.hooks.vcs.urls]
Homepage = "https://github.com/Skulldorom/flask-session.manager.sk"
Repository = "https://github.com/Skulldorom/flask-session.manager.sk"
Issues = "https://github.com/Skulldorom/flask-session.manager.sk/issues"
"Release Source" = "https://github.com/Skulldorom/flask-session.manager.sk/commit/{commit_hash}"

[dependency-groups]
dev = [
    "hatch-vcs==0.5.0",
    "hatchling==1.33.0",
    "pytest>=9",
    "pyyaml==6.0.4",
    "ruff>=0.14",
    "setuptools-scm==10.3.4",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# This file contains long upstream JavaScript lines as exact-match patch text.
"scripts/patch_companion_harness.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
